# tmux — agent-workspace
# Prefix: Ctrl-a (easier over SSH than Ctrl-b for many operators)

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Faster escape for vim/agents
set -s escape-time 0

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Splits (current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane move (vim-ish)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "[#S] "
set -g status-right "#{?client_prefix,PREFIX ,}%Y-%m-%d %H:%M | #H"

# Aggressive resize when multiple clients attach
setw -g aggressive-resize on

# Keep long agent jobs alive
set -g remain-on-exit off
